# Gemma 4 31B Dense QLoRA Configuration
model:
  model_id: "google/gemma-4-31B-it"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)"

training:
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  optim: "adamw_8bit"
  max_length: 2048
  bf16: true
  logging_steps: 5
  save_strategy: "epoch"

collator:
  name: "Gemma4TextDataCollator"
  inject_mm_token_type_ids: true
  pad_to_multiple_of: 8

hardware:
  recommended_machine_type: "a2-ultragpu-1g" # 1x A100 80GB
  high_throughput_machine_type: "a3-highgpu-8g" # 8x H100 80GB
