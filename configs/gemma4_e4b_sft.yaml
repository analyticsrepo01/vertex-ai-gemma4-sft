# Gemma 4 E4B (8B) SFT Configuration
model:
  model_id: "google/gemma-4-E4B-it"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: false # Fits in BF16 on single A100/H100

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)"

training:
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optim: "adamw_torch"
  max_length: 2048
  bf16: true
  logging_steps: 10
  save_strategy: "epoch"

collator:
  name: "Gemma4TextDataCollator"
  inject_mm_token_type_ids: true
  pad_to_multiple_of: 8
